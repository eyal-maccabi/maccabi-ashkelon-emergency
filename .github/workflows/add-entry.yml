name: הוספת רשומה — טלפון או תפקיד

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "לאיזה קובץ להוסיף?"
        required: true
        type: choice
        options:
          - phones
          - roles
      group:
        description: "(רק לטלפונים) שם הקבוצה, לדוגמה: אחראי יחידות — מרחב אשקלון"
        required: false
        default: ""
      role_or_label:
        description: "לתפקידים: שם התפקיד (למשל: מנהלת סיעוד). לטלפונים: התווית (למשל: מ. מעבדה — מירב אלזם)"
        required: true
      name:
        description: "(רק לתפקידים) שם האדם"
        required: false
        default: ""
      phone:
        description: "מספר טלפון"
        required: true
      notes:
        description: "(רק לטלפונים) הערות"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  add-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: הוספת השורה ל-CSV
        run: |
          python3 - <<'PYEOF'
          import csv, os

          sheet = os.environ["SHEET"]
          group = os.environ["GROUP"]
          role_or_label = os.environ["ROLE_OR_LABEL"]
          name = os.environ["NAME"]
          phone = os.environ["PHONE"]
          notes = os.environ["NOTES"]

          if sheet == "phones":
              path = "data/phones.csv"
              row = [group or "כללי", role_or_label, phone, notes]
          else:
              path = "data/roles.csv"
              row = [role_or_label, name, phone]

          with open(path, "a", encoding="utf-8", newline="") as f:
              csv.writer(f).writerow(row)

          print(f"נוספה שורה ל-{path}: {row}")
          PYEOF
        env:
          SHEET: ${{ inputs.sheet }}
          GROUP: ${{ inputs.group }}
          ROLE_OR_LABEL: ${{ inputs.role_or_label }}
          NAME: ${{ inputs.name }}
          PHONE: ${{ inputs.phone }}
          NOTES: ${{ inputs.notes }}

      - name: Commit + push
        run: |
          git config user.name "maccabi-emergency-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/phones.csv data/roles.csv
          git commit -m "הוספת רשומה (${{ inputs.sheet }}) — ${{ inputs.role_or_label }}" || echo "אין שינוי לקומיט"
          git push
